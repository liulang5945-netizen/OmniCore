name: OmniCore Tests
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install fastapi uvicorn httpx pydantic
          pip install psutil requests beautifulsoup4
          pip install jieba numpy

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short -x -k "not test_cuda and not test_gguf and not test_model_download and not test_installer" --ignore=tests/test_api_integration.py --ignore=tests/deep_test.py --ignore=tests/run_evaluation.py
        env:
          PYTHONPATH: ${{ github.workspace }}
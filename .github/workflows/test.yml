name: OmniCore Tests
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install fastapi uvicorn httpx pydantic python-multipart
          pip install psutil requests beautifulsoup4
          pip install jieba numpy

      - name: Run unit tests (no torch required)
        run: |
          python -m pytest tests/test_v1_2_to_v1_4.py -v --tb=short -x -k "not API and not Endpoint"
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Verify imports
        run: |
          python -c "from core.config import TrainingConfig; from core.security import JWTManager; from agent.memory_manager import ShortTermMemory; print('Core imports OK')"
        env:
          PYTHONPATH: ${{ github.workspace }}